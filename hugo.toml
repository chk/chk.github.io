baseURL = "https://christian.korn.cx/"
languageCode = "de-de"
defaultContentLanguage = "de"
title = "chk"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  description = "Blog und Notizen von Christian Korn"
  author = "Christian Korn"
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false

  [params.profileMode]
    enabled = true
    title = "Christian Korn"
    subtitle = "Ich lasse Maschinen miteinander sprechen."
    imageUrl = "images/avatar.png"
    imageTitle = "Christian Korn"
    imageWidth = 120
    imageHeight = 120

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/chk"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/christian-korn-801a67332/"

[[params.socialIcons]]
  name = "instagram"
  url = "https://www.instagram.com/insta_chk/"

[[params.socialIcons]]
  name = "letterboxd"
  url = "https://letterboxd.com/synfld/"

# Navigation – neue Seiten hier eintragen
[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    name = "Über mich"
    url = "/about/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

# Blog-URLs mit Datum, z. B. /posts/2026/11/19/mein-titel/
[permalinks]
  posts = "/posts/:year/:month/:day/:contentbasename/"
